id: LEND_HOUSING
name: Lending Indicators - Housing Finance
description: |
  Monthly housing loan commitments by purpose, lender type, and state.
  Covers new loan commitments to households for owner-occupier and investor housing.
  Source: ABS Catalogue 5601.0.
update_frequency: monthly
source_url: https://www.abs.gov.au/statistics/economy/finance/lending-indicators
search_keywords: [mortgage, mortgages, home loans, housing finance, housing loans, owner occupier loans, investor loans, first home buyers, fhb, lending, new loan commitments, refinancing]
dimensions:
  measure:
    sdmx_id: MEASURE
    description: What is being measured (defaults to dollar value of new loans — the headline housing-finance figure)
    default: "FIN_VAL"
    values:
      value: { sdmx_code: "FIN_VAL", description: "Value of new loans ($)" }
      number: { sdmx_code: "FIN_NUM", description: "Number of new loans" }
      average: { sdmx_code: "FIN_AVG", description: "Average new loan size" }
  housing_purpose:
    sdmx_id: HOUSING_PURPOSE
    description: Borrower category (defaults to owner-occupier)
    default: "DV5167"
    values:
      owner_occupier: { sdmx_code: "DV5167" }
      investor: { sdmx_code: "DV5168" }
      first_home_buyers: { sdmx_code: "TOT_FHB", description: "Total first home buyers" }
      owner_occupier_fhb: { sdmx_code: "DV5167_FHB" }
      total: { sdmx_code: "TOT" }
  lender_type:
    sdmx_id: LENDER_TYPE
    description: Type of lender (defaults to all)
    default: "TOT"
    values:
      all: { sdmx_code: "TOT" }
      major_banks: { sdmx_code: "MAJ_B" }
      other_adi: { sdmx_code: "OTH_ADI", description: "Other Authorised Deposit-taking Institutions" }
      non_adi: { sdmx_code: "NON_ADI" }
  region:
    sdmx_id: REGION
    description: State or territory
    values:
      australia: { sdmx_code: "AUS" }
      nsw: { sdmx_code: "1" }
      vic: { sdmx_code: "2" }
      qld: { sdmx_code: "3" }
      sa:  { sdmx_code: "4" }
      wa:  { sdmx_code: "5" }
      tas: { sdmx_code: "6" }
      nt:  { sdmx_code: "7" }
      act: { sdmx_code: "8" }
  data_item:
    sdmx_id: DATA_ITEM
    description: Defaults to new commitments — the headline reported figure
    hidden: true
    default: "NEWCOMMITS"
  loan_type:
    sdmx_id: LOAN_TYPE
    hidden: true
    default: "DV8368"
  loan_purpose:
    sdmx_id: LOAN_PURPOSE
    description: Defaults to total dwellings (the broadest residential aggregate ABS publishes)
    hidden: true
    default: "TOTDWELL"
  adjustment:
    sdmx_id: TSEST
    description: Defaults to seasonally adjusted
    hidden: true
    default: "20"
  frequency:
    sdmx_id: FREQ
    description: Lending Indicators are published quarterly
    hidden: true
    default: "Q"
