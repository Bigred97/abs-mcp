id: CPI
sdmx_dataflow_id: CPI_Q
name: Consumer Price Index (Quarterly)
description: |
  Quarterly Consumer Price Index — the official inflation rate the RBA,
  Treasury, AFR, and economists reference when they say "CPI". Source:
  ABS Catalogue 6401.0.

  Periods are quarterly (e.g. 2025-Q1, 2025-Q2). Pairs naturally with WPI
  on the same period grid for real-wages analysis.

  For the supplementary monthly indicator (cat 6484.0) — published faster
  but with a narrower measure set and considered less authoritative — use
  the CPI_MONTHLY dataset.
update_frequency: quarterly
source_url: https://www.abs.gov.au/statistics/economy/price-indexes-and-inflation/consumer-price-index-australia
search_keywords:
  - inflation
  - cost of living
  - consumer prices
  - price index
  - basket of goods
  - deflation
  - cpi inflation
  - headline inflation
  - quarterly cpi
  - core inflation
  - trimmed mean
  - weighted median
dimensions:
  measure:
    sdmx_id: MEASURE
    description: What is being measured (defaults to annual % change — the headline inflation figure)
    default: "3"
    values:
      change_year: { sdmx_code: "3", description: "% change from corresponding quarter of previous year (annual inflation)" }
      change_quarter: { sdmx_code: "2", description: "% change from previous quarter" }
      index: { sdmx_code: "1", description: "Index numbers (quarterly)" }
  category:
    sdmx_id: INDEX
    description: |
      Which series to query (defaults to headline All Groups CPI, seasonally
      adjusted — the figure the RBA targets). ABS publishes the quarterly
      annual-change series only for the seasonally adjusted headline plus the
      two core measures (trimmed mean, weighted median). Sub-category
      breakdowns (food, housing, transport, etc.) are only published
      monthly — use the CPI_MONTHLY dataset for those.
    default: "999901"
    values:
      all_groups: { sdmx_code: "999901", description: "All groups CPI, seasonally adjusted (headline)" }
      trimmed_mean: { sdmx_code: "999902", description: "Trimmed Mean — RBA's preferred core inflation measure" }
      weighted_median: { sdmx_code: "999903", description: "Weighted Median — alternative core inflation measure" }
  region:
    sdmx_id: REGION
    description: |
      Region. The quarterly CPI publishes the national weighted-average of
      eight capital cities only. For per-city CPI use CPI_MONTHLY, which
      carries city-level series.
    default: "50"
    values:
      australia: { sdmx_code: "50", description: "Weighted average of eight capital cities" }
  adjustment:
    sdmx_id: TSEST
    description: |
      Time-series treatment. ABS publishes the QUARTERLY CPI in the SA
      (seasonally adjusted) series only — Original (NSA) time-series and
      Trend are not provided for the quarterly dataflow. If you need
      the Original (NSA) headline CPI, query CPI_MONTHLY (cat 6484.0)
      which publishes monthly Original values for all-groups and
      sub-categories. Customers comparing against RBA / Treasury commentary
      should note RBA cites the SA series ('the 4.0% in Q1 2026' = SA).
    default: "20"
    values:
      seasonally_adjusted: { sdmx_code: "20", description: "Seasonally adjusted (default; the only series published for quarterly CPI)" }
      original: { sdmx_code: "10", description: "Original (NSA) — not published for quarterly CPI; use CPI_MONTHLY for Original" }
      trend: { sdmx_code: "30", description: "Trend — not published for quarterly CPI" }
  frequency:
    sdmx_id: FREQ
    description: ABS frequency code — quarterly for this dataflow.
    hidden: true
    default: "Q"
