id: CPI_MONTHLY
sdmx_dataflow_id: CPI
name: Monthly Consumer Price Index Indicator
description: |
  Monthly Consumer Price Index — the monthly read on inflation. Sourced
  from the ABS `CPI` dataflow (the consolidated CPI product) filtered to
  monthly frequency (FREQ=M). Source: ABS Catalogue 6401.0.

  NOTE (2026 transition): ABS originally published the monthly indicator
  under a separate `CPI_M` dataflow (cat 6484.0). That dataflow froze at
  2025-09 when ABS moved to a complete monthly CPI. The live monthly
  series now lives in the main `CPI` dataflow keyed by FREQ=M, which this
  dataset points at — so it stays current (2026-03 onward) automatically.

  Periods are monthly (e.g. 2026-02, 2026-03). For the canonical quarterly
  CPI that economists, the RBA, and Treasury cite when they say "CPI" or
  "inflation rate", use the CPI dataset.

  This monthly indicator carries the full sub-category breakdown (food,
  housing, transport, etc.) and individual capital cities — neither of which
  the quarterly CPI publishes at the headline level.
update_frequency: monthly
source_url: https://www.abs.gov.au/statistics/economy/price-indexes-and-inflation/monthly-consumer-price-index-indicator
search_keywords:
  - monthly cpi
  - monthly inflation
  - monthly cpi indicator
  - monthly consumer prices
  - monthly price index
  - monthly inflation indicator
  - between quarterly cpi releases
  - faster cadence inflation
dimensions:
  measure:
    sdmx_id: MEASURE
    description: What is being measured (defaults to annual % change — the headline indicator figure)
    default: "3"
    values:
      change_year: { sdmx_code: "3", description: "% change from same month of previous year (annual inflation)" }
      change_month: { sdmx_code: "2", description: "% change from previous month" }
      index: { sdmx_code: "1", description: "Index numbers (monthly)" }
      contribution_to_index: { sdmx_code: "4", description: "Contribution to total CPI" }
  category:
    sdmx_id: INDEX
    description: |
      CPI category — top-level expenditure division (defaults to All
      groups). Sub-categories (e.g. 'Bread and cereal products' inside
      Food) are also queryable via raw INDEX codes; see ABS Cat 6484.0
      documentation for the full hierarchy. Note: ABS uses
      non-consecutive codes for the 11 divisions — Food/Clothing/Housing/
      Furnishings/Transport/Alcohol are in the 20xxx block while
      Health/Communication/Recreation/Education/Insurance use 115xxx
      and 126xxx codes.
    default: "10001"
    values:
      all_groups: { sdmx_code: "10001", description: "All groups CPI" }
      food: { sdmx_code: "20001", description: "Food and non-alcoholic beverages" }
      clothing: { sdmx_code: "20002", description: "Clothing and footwear" }
      housing: { sdmx_code: "20003", description: "Housing" }
      furnishings: { sdmx_code: "20004", description: "Furnishings, household equipment and services" }
      transport: { sdmx_code: "20005", description: "Transport" }
      alcohol_tobacco: { sdmx_code: "20006", description: "Alcohol and tobacco" }
      health: { sdmx_code: "115486", description: "Health" }
      communication: { sdmx_code: "115488", description: "Communication" }
      recreation: { sdmx_code: "115489", description: "Recreation and culture" }
      education: { sdmx_code: "115493", description: "Education" }
      insurance_financial: { sdmx_code: "126670", description: "Insurance and financial services" }
  region:
    sdmx_id: REGION
    description: Capital city (or 'australia' for the weighted average)
    default: "50"
    values:
      australia: { sdmx_code: "50", description: "Weighted average of eight capital cities" }
      sydney: { sdmx_code: "1" }
      melbourne: { sdmx_code: "2" }
      brisbane: { sdmx_code: "3" }
      adelaide: { sdmx_code: "4" }
      perth: { sdmx_code: "5" }
      hobart: { sdmx_code: "6" }
      darwin: { sdmx_code: "7" }
      canberra: { sdmx_code: "8" }
  adjustment:
    sdmx_id: TSEST
    description: |
      Time-series treatment (defaults to Original — the official ABS
      monthly indicator series). Pass `seasonally_adjusted` for the SA
      series, or `trend` for the trend series.
    default: "10"
    values:
      original: { sdmx_code: "10", description: "Original (NSA) — the official figure" }
      seasonally_adjusted: { sdmx_code: "20", description: "Seasonally adjusted" }
      trend: { sdmx_code: "30", description: "Trend" }
  frequency:
    sdmx_id: FREQ
    description: ABS frequency code — monthly for this dataflow.
    hidden: true
    default: "M"
